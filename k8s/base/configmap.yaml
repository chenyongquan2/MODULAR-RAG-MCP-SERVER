apiVersion: v1
kind: ConfigMap
metadata:
  name: modular-rag-config
  namespace: modular-rag
  labels:
    app.kubernetes.io/part-of: modular-rag
data:
  settings.yaml: |
    # Modular RAG MCP Server - Kubernetes Configuration
    llm:
      provider: "azure"
      model: "gpt-4o"
      deployment_name: "gpt-4o"
      azure_endpoint: ""
      api_version: "2024-02-15-preview"
      api_key: ""  # Use AZURE_OPENAI_API_KEY env var
      temperature: 0.0
      max_tokens: 4096

    embedding:
      provider: "azure"
      model: "text-embedding-ada-002"
      dimensions: 1536
      azure_endpoint: ""
      deployment_name: "text-embedding-ada-002"
      api_version: "2024-02-15-preview"
      api_key: ""  # Use AZURE_OPENAI_API_KEY env var

    vision_llm:
      enabled: true
      provider: "azure"
      model: "gpt-4o"
      azure_endpoint: ""
      deployment_name: "gpt-4o"
      api_version: "2024-02-15-preview"
      api_key: ""
      max_image_size: 2048

    vector_store:
      provider: "chroma"
      persist_directory: "/app/data/db/chroma"
      collection_name: "knowledge_hub"

    retrieval:
      dense_top_k: 20
      sparse_top_k: 20
      fusion_top_k: 10
      rrf_k: 60

    rerank:
      enabled: false
      provider: "none"
      model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_k: 5

    evaluation:
      enabled: false
      provider: "custom"
      metrics:
        - "hit_rate"
        - "mrr"
        - "faithfulness"

    observability:
      log_level: "INFO"
      trace_enabled: true
      trace_file: "/app/logs/traces.jsonl"
      structured_logging: true

    ingestion:
      chunk_size: 1000
      chunk_overlap: 200
      splitter: "recursive"
      batch_size: 100
      chunk_refiner:
        use_llm: false
      metadata_enricher:
        use_llm: false
