apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: modular-rag
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: modular-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: modular-rag
    spec:
      containers:
        - name: mcp-server
          image: modular-rag:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.mcp_server.server"]
          env:
            - name: CHROMA_HOST
              value: "chromadb"
            - name: CHROMA_PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: modular-rag-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          stdin: true
      volumes:
        - name: config
          configMap:
            name: modular-rag-config
        - name: logs
          emptyDir: {}
