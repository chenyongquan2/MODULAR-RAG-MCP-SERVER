apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modular-rag.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "modular-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.azureOpenaiApiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
