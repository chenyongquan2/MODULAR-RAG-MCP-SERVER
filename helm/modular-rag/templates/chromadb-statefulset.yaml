{{- if .Values.chromadb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "modular-rag.fullname" . }}-chromadb
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "modular-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: chromadb
spec:
  serviceName: {{ include "modular-rag.fullname" . }}-chromadb
  replicas: {{ .Values.chromadb.replicas }}
  selector:
    matchLabels:
      {{- include "modular-rag.selectorLabels" "chromadb" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "modular-rag.selectorLabels" "chromadb" | nindent 8 }}
    spec:
      containers:
        - name: chromadb
          image: "{{ .Values.chromadb.image.repository }}:{{ .Values.chromadb.image.tag }}"
          imagePullPolicy: {{ .Values.chromadb.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
            - name: PERSIST_DIRECTORY
              value: "/data"
          volumeMounts:
            - name: chroma-data
              mountPath: /data
          resources:
            {{- toYaml .Values.chromadb.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
  {{- if .Values.chromadb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["{{ .Values.chromadb.persistence.accessMode }}"]
        {{- if .Values.chromadb.persistence.storageClass }}
        storageClassName: {{ .Values.chromadb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.chromadb.persistence.size }}
  {{- end }}
{{- end }}
