[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A pluggable, observable RAG framework exposed via MCP protocol"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.1.0",
    # 锁定 chromadb 版本以避免与 protobuf 版本冲突
    # chromadb 1.5.x 与 protobuf 4.x+ 不兼容，使用稳定的 1.4.x 版本
    "chromadb>=0.4.0,<1.5",
    # 显式约束 protobuf，避免 chromadb 导入时报
    # "Descriptors cannot be created directly" 兼容性错误
    "protobuf>=3.20.0,<4",
    "pillow>=10.0.0",
    # Docling: PDF/DOCX/PPTX → 结构化 Markdown，保留标题层级和表格，支持 OCR
    # 替换原有 markitdown[pdf]，输出带 # 标题层级的 Markdown，显著提升 RAG chunk 质量
    "docling>=2.0.0",
    "reportlab>=4.0.0",
    "mcp>=1.0.0",
    # CHM文档支持：先用 hh.exe 解压 CHM，再用 markdownify 转 Markdown
    "markdownify>=0.11.0",
    # Dashboard UI 框架
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    # ─── 评估系统 (Feature-001 RAG 质量验收) ───
    # CRITICAL: ragas 版本是 Feature-001 基线锚定点;不同版本判分尺度不同,
    # 擅自升级会破坏 SC-005 / SC-008 的可比性。修改前请走 SDD 流程。
    # 详见 specs/001-rag-acceptance/research.md § Decision 1
    "ragas==0.1.21",
    # langchain-openai: 把 LLMFactory 的 OpenAI 兼容 provider (glm/openai/azure/deepseek)
    # 适配为 RAGAS 期待的 LangChain BaseLLM/Embeddings 接口
    # 详见 specs/001-rag-acceptance/research.md § Decision 2
    "langchain-openai>=0.1.0",
    # datasets: ragas evaluate() 的核心依赖 (Dataset.from_dict)
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]
# 文档工具链依赖（scripts/md_to_pdf_with_watermark.py 用于把 Markdown
# 渲染成带水印的 PDF）。不属于 RAG 运行时，单独成组以免拖累核心安装。
docs = [
    "markdown>=3.5",
]
# ─── 重排（rerank）能力 ───
# Cross-Encoder 重排是检索链路的第二阶段：对融合后的候选做精细重新排序。
# 与 dense/sparse 检索用的 bi-encoder 不同，cross-encoder 把 query 与文档
# 拼接后一起过 Transformer，精度更高但无法预计算，只能对少量候选实时打分。
#
# 为什么是 optional extra 而不是核心依赖：sentence-transformers 会拖 torch
# （CPU 版通常 200MB+）。重排默认关闭（settings.yaml 的 rerank.backend: none），
# 不该让一个默认不启用的能力向所有安装收税。
#
# 启用方式：pip install -e ".[rerank]"
# 注意：本地推理，零 token 消耗；首次加载模型需能访问 HuggingFace 下载权重
#       （国内设 HF_ENDPOINT=https://hf-mirror.com），落盘后完全离线可用。
rerank = [
    "sentence-transformers>=2.2.0",
]

# 使用 src 布局，将 src 作为顶级包
# 这样 "from src.xxx" 导入在 editable install 后可以正常工作
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need external services)",
    "e2e: End-to-end tests (full pipeline)",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"
