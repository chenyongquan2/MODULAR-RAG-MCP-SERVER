[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A pluggable, observable RAG framework exposed via MCP protocol"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.1.0",
    # 锁定 chromadb 版本以避免与 protobuf 版本冲突
    # chromadb 1.5.x 与 protobuf 4.x+ 不兼容，使用稳定的 1.4.x 版本
    "chromadb>=0.4.0,<1.5",
    # 显式约束 protobuf，避免 chromadb 导入时报
    # "Descriptors cannot be created directly" 兼容性错误
    "protobuf>=3.20.0,<4",
    "pillow>=10.0.0",
    "markitdown[pdf]>=0.0.1",
    "reportlab>=4.0.0",
    "mcp>=1.0.0",
    # CHM文档支持：先用 hh.exe 解压 CHM，再用 markdownify 转 Markdown
    "markdownify>=0.11.0",
    # Dashboard UI 框架
    "streamlit>=1.28.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

# 使用 src 布局，将 src 作为顶级包
# 这样 "from src.xxx" 导入在 editable install 后可以正常工作
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need external services)",
    "e2e: End-to-end tests (full pipeline)",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"
