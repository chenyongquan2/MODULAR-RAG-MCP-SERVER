# 同义词 / 术语扩展词表（IDF 筛选版）
#
# ⚠️ **本表是第二版。第一版（32 组，保留在 logs/synonyms_v1_broad.yaml）在 A/B 上
#    明确有害** —— sparse 单路 MRR 0.8104 → 0.7311（−0.0793），四项全跌。
#
# ---------------------------------------------------------------------------
# 第一版错在哪：选词判据用反了
# ---------------------------------------------------------------------------
#
# 第一版的判据是「缩写在语料里近乎零信号、全称大量存在」，看上去很合理 ——
# 那个词原本对 BM25 贡献为 0，扩展后才第一次有分。
#
# **但「大量存在」恰恰是 BM25 里最没用的性质。** BM25 逐词求和，每个词的贡献
# 按 IDF（逆文档频率）加权：一个词出现在越多文档里，它的区分度越低。实测：
#
#   扩展目标        占语料      IDF
#   manager         26.3%      1.030      <- 匹配四分之一的语料
#   value           22.3%      1.250
#   server          12.4%      1.951
#   config          11.9%      1.998
#
# 而被它们「补充」的缩写，在存在时 IDF 极高（grp 8.257 / func 8.845 / idx 9.944）。
# 于是扩展做的事是：**在一个高区分度的查询里，塞进一个匹配全语料四分之一的词**。
# 那个词会把几千个弱相关文档拉进候选，把真命中挤下去。
#
# ---------------------------------------------------------------------------
# 第二版的判据
# ---------------------------------------------------------------------------
#
# 两条同时满足才收：
#   1. 缩写在语料里近乎零信号（否则原查询本来就能命中，扩展是多余的）
#   2. **扩展目标本身足够稀有**：IDF >= 3.0（约等于 df <= 5% 的语料）
#
# 第 2 条是第一版缺的那一半。按它重筛，32 组只剩 12 组。
#
# ⚠️ 筛选依据是**语料的先验统计（IDF）**，不是 A/B 的结果 —— 前者与金标标签
#    无关，后者才会造成对测试集的过拟合。这个区别很重要。
#
# ⚠️ 词表是**语料相关的**。换语料必须重新构建，且要重新算 IDF。
#
# 格式：<任一词面>: [<其余等价词面>, ...]，双向展开，多词写法会过 tokenizer 切分。
#
bal: [balance]   # balance IDF 4.25
msg: [message]   # message IDF 5.60
evt: [event]   # event IDF 3.85
evts: [events]   # events IDF 4.13
func: [function]   # function IDF 3.53
impl: [implementation]   # implementation IDF 5.17
idx: [index]   # index IDF 3.34
addr: [address]   # address IDF 4.35
attr: [attribute]   # attribute IDF 9.16
proc: [process]   # process IDF 5.90
db: [database]   # database IDF 3.03
del: [delete]   # delete IDF 3.15
