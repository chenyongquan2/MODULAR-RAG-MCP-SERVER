# Modular RAG MCP Server - 主配置文件

# LLM 配置
llm:
  provider: glm             # glm | azure | openai | ollama | deepseek
  model: 	GLM-4.6
  api_key: 7c16c4e2e47d4549a4be243f7aee1bb2.8esyaqPmtiVmqbeb

# Embedding 配置 (使用相同的 API key)
embedding:
  provider: glm             # glm | openai | azure | ollama
  model: embedding-3-pro
  api_key: 7c16c4e2e47d4549a4be243f7aee1bb2.8esyaqPmtiVmqbeb

# Vision LLM 配置
vision_llm:
  provider: azure           # azure
  model: gpt-4o

# 向量存储配置
vector_store:
  backend: chroma           # chroma
  persist_path: ./data/db/chroma

# 文本切分配置
splitter:
  strategy: recursive       # recursive | semantic | fixed
  chunk_size: 500         # 减小 chunk 大小，提高召回精度
  chunk_overlap: 150      # 增加 overlap，减少跨 chunk 丢失

# 检索配置
retrieval:
  sparse_backend: bm25    # 启用 BM25 稀疏检索
  fusion_algorithm: rrf  # rrf
  top_k_dense: 30        # 增加 dense 召回数量
  top_k_sparse: 30       # 增加 sparse 召回数量
  top_k_final: 10

# 重排配置
rerank:
  backend: none           # none | cross_encoder | llm
  model: ""
  top_m: 50              # 增加重排候选数量

# 摄取管道配置
ingestion:
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
  image_captioner:
    enabled: true
    use_fallback: true

# 评估配置
evaluation:
  backends:
    - custom
  golden_test_set: ./tests/fixtures/golden_test_set.json

# 可观测性配置
observability:
  enabled: true
  log_file: ./logs/traces.jsonl
